version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - mongo
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_INITDB_ROOT_USERNAME=application
      - MONGO_INITDB_ROOT_PASSWORD=123cambiar
      - MONGO_DB=test1
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - node_redis
    restart: unless-stopped

  redis:
    image: redis:latest
    networks:
      - node_redis
  
  mongo:
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=application
      - MONGO_INITDB_ROOT_PASSWORD=123cambiar
    networks:
      - node_redis

networks:
  node_redis:
    name: node_redis
